[project]
name = "bulk-certificate-generator"
version = "0.1.0"
description = "A FastAPI-based backend for generating personalized certificates in bulk."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "azure-identity>=1.26.0",
    "azure-storage-blob>=12.31.0",
    "azure-storage-queue>=12.18.0",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

